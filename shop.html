<section style="padding-top:140px;min-height:80vh"><div class="wrap"><div class="title"><span>Store</span><h2>Shop Portal</h2>

<script>
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const grid = document.getElementById('shop-grid');
fetch('/api/products').then(r => r.json()).then(p => {
  if (!p.length) { grid.innerHTML = '<p style="text-align:center;color:var(--mute);grid-column:1/-1">Products coming soon. DM on WhatsApp for details.</p>'; return; }
  grid.innerHTML = p.map(x => {
    const fmt = v => /^\d/.test(v) ? '\u20b9' + v : v, pr = fmt(x.price);
    const off = x.mrp && +x.mrp > +x.price ? Math.round((1 - x.price / x.mrp) * 100) : 0;
    const t = 'Hi Manjit, I want to buy: ' + x.name + ' (' + pr + ')';
    return `<div class="card prod">${x.badge ? `<span class="badge">${esc(x.badge)}</span>` : ''}${x.image ? `<img src="${esc(x.image)}" alt="${esc(x.name)}" onerror="this.remove()">` : ''}${x.category ? `<small class="cat">${esc(x.category)}</small>` : ''}<h3>${esc(x.name)}</h3><p>${esc(x.description)}</p><div class="price">${esc(pr)}${x.mrp ? `<s class="old">${esc(fmt(x.mrp))}</s>` : ''}${off ? `<span class="off">${off}% OFF</span>` : ''}</div><a class="btn" target="_blank" href="https://wa.me/918264767300?text=${encodeURIComponent(t)}">Buy on WhatsApp</a></div>`;
  }).join('');
}).catch(() => { grid.innerHTML = '<p style="text-align:center;color:var(--mute);grid-column:1/-1">Could not load products. Please WhatsApp 8264767300.</p>'; });
</script></body></html>
